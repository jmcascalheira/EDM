name: Build Android APK

# Builds the EDMpy Android APK with Buildozer / python-for-android on a Linux
# runner (Buildozer cannot run on macOS/Windows). Buildozer is installed
# directly (rather than via a third-party Docker action) for reliability.
# Builds are long (~20-40 min on a cold cache). Scoped to the android-port
# branch so it never affects desktop releases. Uploads the APK as an artifact.

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'src/edmpy/**'
      - '.github/workflows/build-android.yaml'

permissions:
  contents: read

jobs:
  build:
    # 22.04 is the most compatible base for Buildozer / the Android NDK toolchain.
    runs-on: ubuntu-22.04
    # Cold arm64 builds run ~30-40 min; cap so a hang fails fast, not after 6h.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The Android Gradle plugin (build-tools 34) requires Java 17; the runner
      # defaults JAVA_HOME to Java 11. setup-java makes 17 the active JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncurses5 libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          # Pin a coherent, known-good toolchain. Unpinned buildozer pulls a
          # bleeding-edge python-for-android (Python 3.14 / NDK r28c) that can't
          # build our recipes. This 2024 stable stack uses Python 3.11 + NDK 25b.
          pip install "cython==0.29.36" "buildozer==1.5.0" "python-for-android==2024.1.21"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            src/edmpy/.buildozer
          # v2 namespace: never restore the old python3.14 build tree from the
          # earlier unpinned run. restore-keys is scoped to v2 so it only reuses
          # caches built with the current pinned p4a/Python toolchain.
          key: buildozer-v2-${{ hashFiles('src/edmpy/buildozer.spec') }}
          restore-keys: buildozer-v2-

      - name: Build debug APK
        working-directory: src/edmpy
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edmpy-debug-apk
          path: src/edmpy/bin/*.apk
          if-no-files-found: error
