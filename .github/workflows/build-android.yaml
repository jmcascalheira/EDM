name: Build Android APK

# Builds the EDMpy Android APK with Buildozer / python-for-android on a Linux
# runner (Buildozer cannot run on macOS/Windows). Buildozer is installed
# directly (rather than via a third-party Docker action) for reliability.
# Builds are long (~20-40 min on a cold cache). Scoped to the android-port
# branch so it never affects desktop releases. Uploads the APK as an artifact.

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - 'src/edmpy/**'
      - '.github/workflows/build-android.yaml'

permissions:
  contents: read

jobs:
  build:
    # 22.04 is the most compatible base for Buildozer / the Android NDK toolchain.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncurses5 libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          # Kivy 2.1.0 must be compiled with Cython < 3.
          pip install "cython<3" buildozer

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            src/edmpy/.buildozer
          key: buildozer-${{ hashFiles('src/edmpy/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        working-directory: src/edmpy
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edmpy-debug-apk
          path: src/edmpy/bin/*.apk
          if-no-files-found: error
